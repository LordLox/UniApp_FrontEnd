name: Android Release CI

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-and-release:
    name: Build, Sign, and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Decode Keystore and Place it
      - name: Decode Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo $SIGNING_KEYSTORE_BASE64 | base64 --decode > ${{ github.workspace }}/UniApp_FrontEnd/app/release-keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x ./UniApp_FrontEnd/gradlew
        working-directory: ./UniApp_FrontEnd # Assuming gradlew is in UniApp_FrontEnd

      - name: Build with Gradle
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/UniApp_FrontEnd/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password=$SIGNING_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD
        working-directory: ./UniApp_FrontEnd

      - name: Sign APK (Alternative if not done via Gradle properties)
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDir: UniApp_FrontEnd/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # This step assumes your unsigned APK is named app-release-unsigned.apk
        # and it will output a signed APK, typically named app-release-signed.apk
        # or similar depending on the action's behavior.
        # Adjust if your Gradle build already produces a signed APK directly.

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: UniApp_FrontEnd/app/build/outputs/apk/release/*-signed.apk # Or the exact path to your signed APK
          # If signing is done directly in the assembleRelease step, the path might be:
          # files: UniApp_FrontEnd/app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release for version ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
